### A client installation for a [MessengerUser], not an authentication session.
###
### Used later to choose push-notification targets. [pushToken] stays unused
### until the notification phase.
class: Device
table: messenger_device

fields:
  ### The [MessengerUser] this installation belongs to.
  user: MessengerUser?, relation(onDelete=Cascade)

  ### Stable id generated by the client for this installation.
  clientId: UuidValue

  ### Platform this installation is running on.
  platform: DevicePlatform

  ### Push token. Null until notifications are implemented.
  pushToken: String?

  createdAt: DateTime, default=now
  lastSeenAt: DateTime

indexes:
  messenger_device_client_unique_idx:
    fields: clientId
    unique: true

  messenger_device_user_idx:
    fields: userId
