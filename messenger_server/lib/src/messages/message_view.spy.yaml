### A [Message] plus sender and receipt data for the current caller.
class: MessageView
fields:
  message: Message
  senderUsername: String
  senderProfileImageId: int?
  isMine: bool
  receipts: List<MessageReceipt>
  ### Encrypted JPEG poster for a video message. Null for other types.
  thumbnailMediaId: int?
  ### Decrypted poll. Null unless [Message.type] is poll and the message
  ### has not been deleted.
  poll: PollView?
  ### Emoji totals for this message. Empty when there are no reactions or
  ### the message is deleted.
  reactions: List<MessageReactionView>?
