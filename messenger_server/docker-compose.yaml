services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: messenger
      POSTGRES_PASSWORD: "gVUIbezAWTjK6WJ945I3BFGaWYF4kygs"
    volumes:
      - messenger_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "SrjqPIh71AfyALSEv-h5RdaNRjgQ-Z5F"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: messenger_test
      POSTGRES_PASSWORD: "JwezD3UFyZKoFtpEyse821RTWdM0RtKO"
    volumes:
      - messenger_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "9z0N5H6nCZLFoITeLtSQVTiuyQ8SKKQH"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  messenger_data:
  messenger_test_data:
